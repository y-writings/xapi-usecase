# This TOML file contains project-specific settings.
# Add project-specific information here.

[tools]
go = "1.26.3"
golangci-lint = "2.12.2"

[tasks.fmt]
description = "Format Go source files"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Check Go source formatting"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "Run Go linters"
run = "golangci-lint run ./..."

[tasks.modernize]
description = "Run Go modernization linter"
run = "golangci-lint run --enable-only modernize ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.generate]
description = "Generate Go output models and output reference documentation"
run = "go run ./tools/generate-output"

[tasks."generate:check"]
description = "Regenerate output artifacts and fail if they are stale"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go run ./tools/generate-output
git diff --exit-code -- internal/output/search.gen.go docs/reference/search-output.md
test -z "$(git ls-files --others --exclude-standard -- internal/output docs/reference)"
'''

[tasks.check]
description = "Run formatting, lint, and tests"
run = [
  { task = "fmt:check" },
  { task = "generate:check" },
  { task = "lint" },
  { task = "test" },
]
